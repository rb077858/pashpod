<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PashPod</title>

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

    :root{
        --glass-bg: rgba(255,255,255,0.88);

        --spotify:#1DB954;
        --pocketcasts:#f43e37;
        --podcastaddict:#f48424;

        --text-dark:#1f2937;
        --text-light:#6b7280;

        --accent:#3498db;
    }

    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        min-height:100vh;

        font-family:'Assistant',sans-serif;

        background-size:cover;
        background-position:center;
        background-repeat:no-repeat;
        background-attachment:fixed;

        display:flex;
        justify-content:center;
        align-items:flex-start;

        padding:30px 15px;

        overflow-x:hidden;
        position:relative;
    }

    body::before{
        content:'';

        position:fixed;
        inset:0;

        background:rgba(0,0,0,0.45);
        backdrop-filter:blur(8px);

        z-index:-1;
    }

    .container{
        width:100%;
        max-width:720px;

        background:var(--glass-bg);

        border-radius:30px;

        padding:30px;

        box-shadow:
            0 10px 40px rgba(0,0,0,0.35);

        animation:fadeIn .5s ease;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(15px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    .podcast-header{
        display:flex;
        gap:20px;
        align-items:center;
        flex-wrap:wrap;

        margin-bottom:25px;
    }

    .podcast-image{
        width:130px;
        height:130px;

        object-fit:cover;

        border-radius:22px;

        box-shadow:
            0 8px 25px rgba(0,0,0,0.25);
    }

    .podcast-info{
        flex:1;
        min-width:220px;
    }

    .podcast-title{
        margin:0;

        color:var(--text-dark);

        font-size:2.2rem;
    }

    .podcast-description{
        margin-top:10px;

        color:var(--text-light);

        line-height:1.7;
    }

    .platforms{
        display:grid;
        gap:12px;

        margin-top:22px;
    }

    .platform-btn{
        display:flex;
        align-items:center;
        gap:12px;

        text-decoration:none;

        color:white;

        padding:14px 20px;

        border-radius:18px;

        font-size:1rem;
        font-weight:700;

        transition:.2s;

        box-shadow:
            0 5px 18px rgba(0,0,0,0.18);
    }

    .platform-btn:hover{
        transform:scale(1.02);
    }

    .platform-btn i{
        font-size:1.3rem;
    }

    .spotify{
        background:var(--spotify);
    }

    .pocketcasts{
        background:var(--pocketcasts);
    }

    .podcastaddict{
        background:var(--podcastaddict);
    }

    .episodes-title{
        margin-top:35px;
        margin-bottom:15px;

        font-size:1.4rem;
        font-weight:700;

        color:var(--text-dark);
    }

    .episodes{
        display:flex;
        flex-direction:column;
        gap:14px;
    }

    .episode{
        background:white;

        border-radius:20px;

        padding:18px;

        box-shadow:
            0 4px 16px rgba(0,0,0,0.08);

        transition:.2s;
    }

    .episode:hover{
        transform:translateY(-2px);
    }

    .episode-top{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;

        gap:15px;
    }

    .episode-title{
        font-size:1.1rem;
        font-weight:700;

        color:var(--text-dark);
    }

    .episode-date{
        white-space:nowrap;

        color:var(--text-light);

        font-size:.9rem;
    }

    .episode-description{
        margin-top:12px;

        color:#4b5563;

        line-height:1.7;
    }

    audio{
        width:100%;
        margin-top:15px;
    }

    .episode-links{
        display:flex;
        flex-wrap:wrap;
        gap:10px;

        margin-top:15px;
    }

    .episode-links a{
        text-decoration:none;

        background:#eef6ff;

        color:#2563eb;

        padding:8px 14px;

        border-radius:12px;

        font-size:.95rem;
        font-weight:700;
    }

    .loading{
        color:white;

        margin-top:80px;

        text-align:center;

        font-size:1.2rem;
    }

    @media(max-width:700px){

        .container{
            padding:22px;
        }

        .podcast-header{
            flex-direction:column;
            text-align:center;
        }

        .podcast-image{
            width:150px;
            height:150px;
        }
    }

</style>
</head>
<body>

<div class="loading" id="loading">
    טוען פודקאסט...
</div>

<div class="container" id="container" style="display:none;">

    <div class="podcast-header">

        <img class="podcast-image" id="podcast-image">

        <div class="podcast-info">

            <h1 class="podcast-title" id="podcast-title"></h1>

            <div class="podcast-description" id="podcast-description"></div>

        </div>

    </div>

    <div class="platforms">

        <a href="https://open.spotify.com/show/4emmIesm6wIUK9gl6NgEY0?si=ZFpx7q80QKWL244rPdwN7A"
           class="platform-btn spotify"
           target="_blank">

            <i class="fab fa-spotify"></i>
            Spotify

        </a>

        <a href="https://pca.st/podcast/f42817a0-021f-013f-2afb-0e956d54cc61"
           class="platform-btn pocketcasts"
           target="_blank">

            <i class="fa-solid fa-radio"></i>
            Pocket Casts

        </a>

        <a href="https://podcastaddict.com/podcast/pashpod/6851701"
           class="platform-btn podcastaddict"
           target="_blank">

            <i class="fa-solid fa-rss"></i>
            Podcast Addict

        </a>

    </div>

    <div class="episodes-title">
        <i class="fa-solid fa-headphones"></i>
        פרקים
    </div>

    <div class="episodes" id="episodes"></div>

</div>

<script>

const rssUrl =
    "https://anchor.fm/s/10e3b44f8/podcast/rss";

const apiUrl =
    "https://api.rss2json.com/v1/api.json?rss_url=" +
    encodeURIComponent(rssUrl);

async function loadPodcast(){

    try{

        const response =
            await fetch(apiUrl);

        const data =
            await response.json();

        if(data.status !== "ok"){
            throw new Error("RSS Error");
        }

        const feed =
            data.feed;

        const image =
            feed.image ||
            feed.thumbnail ||
            "";

        if(image){

            document.body.style.backgroundImage =
                `url('${image}')`;

            document.getElementById("podcast-image").src =
                image;
        }

        document.getElementById("podcast-title").textContent =
            feed.title || "PashPod";

        document.getElementById("podcast-description").innerHTML =
            feed.description || "";

        const episodesContainer =
            document.getElementById("episodes");

        data.items.forEach((episode)=>{

            const div =
                document.createElement("div");

            div.className =
                "episode";

            const date =
                new Date(episode.pubDate)
                .toLocaleDateString("he-IL");

            div.innerHTML = `

                <div class="episode-top">

                    <div class="episode-title">
                        ${episode.title || "ללא כותרת"}
                    </div>

                    <div class="episode-date">
                        ${date}
                    </div>

                </div>

                <div class="episode-description">
                    ${episode.description || ""}
                </div>

                ${
                    episode.enclosure?.link
                    ?
                    `
                    <audio controls preload="none">
                        <source src="${episode.enclosure.link}">
                    </audio>
                    `
                    :
                    ""
                }

                <div class="episode-links">

                    ${
                        episode.link
                        ?
                        `
                        <a href="${episode.link}" target="_blank">

                            <i class="fa-solid fa-link"></i>

                            קישור לפרק

                        </a>
                        `
                        :
                        ""
                    }

                </div>

            `;

            episodesContainer.appendChild(div);

        });

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("container").style.display =
            "block";

    }catch(error){

        console.error(error);

        document.getElementById("loading").innerHTML =
            "שגיאה בטעינת הפודקאסט";
    }
}

loadPodcast();

</script>

</body>
</html>
